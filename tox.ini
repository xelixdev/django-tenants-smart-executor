[tox]
envlist =
    py{310,311,312,313,314}-dj{52}
    py{312,313,314}-dj{60}

[gh]
python =
    "3.10" = py310
    "3.11" = py311
    "3.12" = py312
    "3.13" = py313
    "3.14" = py314

[testenv]
usedevelop = true
setenv =
    DJANGO_SETTINGS_MODULE = tests.test_project.settings
deps=
    pytest
    pytest-django
    psycopg[binary]
    dj52: https://github.com/django/django/archive/stable/5.2.x.tar.gz#egg=django
    dj60: https://github.com/django/django/archive/stable/6.0.x.tar.gz#egg=django
commands=
    pytest
passenv =
    DB_HOST
    DB_PORT
    DB_NAME
    DB_USER
    DB_PASSWORD
